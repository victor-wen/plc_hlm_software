# Windows MSVC 2022 x64 Debug/Release build matrix (spec §15.1, §17) plus
# Release packaging, deploy-dependency checks and artifact upload (Task 21).
#
# All third-party actions are pinned to reviewed commit SHAs (not tags or
# branches). Verified 2026-09-04 via the GitHub API:
#   actions/checkout        v7.0.1  -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   ilammy/msvc-dev-cmd     v1.13.0 -> 0b201ec74fa43914dc39ae48a89fd1d8cb592756
#   lukka/run-vcpkg         v11.6   -> b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
#   actions/cache           v6.1.0  -> 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
#   actions/upload-artifact v7.0.1  -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#
# No virtual COM driver is installed in CI (spec §15.5 acceptance runs on a
# local Windows machine with com0com; see docs/testing/rtu-simulator-acceptance.md).
#
# USER-REQUESTED CI OPTIMIZATION (2026-09-04):
# 1) Bootstrap vcpkg only once; do not let run-vcpkg install the manifest and
#    then let CMake install it a second time into build/vcpkg_installed.
# 2) Persist vcpkg binary packages with actions/cache + the vcpkg "files"
#    backend. The old x-gha backend has been removed from current vcpkg, so we
#    must not rely on run-vcpkg's legacy GitHub Actions binary-cache wiring.
# 3) Keep parallel tests bounded so a hung Qt/offscreen test cannot hold a
#    runner indefinitely.
# These are intentionally CI-only changes requested by the repository owner and
# should be preserved when rebasing/merging agent work.

name: windows-build-test

on:
  push:
    branches: [ main, plc-hmi-implementation ]
  pull_request:

permissions:
  contents: read

# Keep the active run alive so a cold vcpkg build can finish and publish its
# binary cache. A newer commit waits for that run, then restores Qt/OpenCV/
# OpenSSL packages instead of compiling all third-party dependencies again.
concurrency:
  group: windows-build-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: MSVC 2022 x64 ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable MSVC 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Include the compiler/SDK identity in the cache key so a hosted-runner
      # toolchain update cannot silently feed ABI-incompatible binaries to vcpkg.
      - name: Capture toolchain cache identity
        id: toolchain
        shell: pwsh
        run: |
          $sdk = "$env:WindowsSDKVersion".TrimEnd('\')
          "id=$env:VCToolsVersion-$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # USER-REQUESTED CI OPTIMIZATION: this action only bootstraps/restores the
      # vcpkg tool itself. Manifest installation is deliberately left to CMake
      # so dependencies are installed exactly once into build/vcpkg_installed.
      - name: Setup vcpkg (bootstrap only)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          doNotCache: false

      # USER-REQUESTED CI OPTIMIZATION: current vcpkg removed the x-gha binary
      # backend. Cache the content-addressed vcpkg binary archives as normal
      # files instead. Debug/Release use the same x64-windows package set, so
      # one populated cache can serve both configurations and the package job.
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}\vcpkg-binary-cache
          key: vcpkg-binary-v1-${{ runner.os }}-x64-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-x64-${{ steps.toolchain.outputs.id }}-
            vcpkg-binary-v1-${{ runner.os }}-x64-

      - name: Ensure vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.workspace }}\vcpkg-binary-cache" | Out-Null

      - name: Configure (HLM_ENABLE_VISION=ON)
        env:
          # Override run-vcpkg's obsolete x-gha setting. CMake's manifest-mode
          # vcpkg install reads/writes binary archives from this cached folder.
          VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.workspace }}\vcpkg-binary-cache,readwrite'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DHLM_ENABLE_VISION=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      # USER-REQUESTED CI OPTIMIZATION: keep independent test executables
      # parallel for fast feedback. The timeout is also a safety guard: a hung
      # Qt/GUI test (for example an offscreen widget event-loop hang) must fail
      # and let the remaining tests continue instead of occupying a runner
      # indefinitely.
      - name: Test (ctest)
        shell: pwsh
        run: |
          # App-local deployment copies linked Qt DLLs beside each test
          # executable, but it does not copy dynamically loaded plugins.
          # Point Qt at the matching vcpkg plugin tree (Debug plugins carry
          # the "d" suffix) and expose plugin dependencies through PATH.
          $vcpkgPrefix = "build/vcpkg_installed/x64-windows"
          if ("${{ matrix.config }}" -eq "Debug") {
            $vcpkgPrefix = Join-Path $vcpkgPrefix "debug"
          }

          $qtPluginRoot = Join-Path $vcpkgPrefix "Qt6/plugins"
          $qtPlatformRoot = Join-Path $qtPluginRoot "platforms"
          $vcpkgBin = Join-Path $vcpkgPrefix "bin"
          if (-not (Test-Path $qtPluginRoot)) {
            throw "Qt plugin directory not found: $qtPluginRoot"
          }
          if (-not (Test-Path $qtPlatformRoot)) {
            throw "Qt platform plugin directory not found: $qtPlatformRoot"
          }
          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg runtime directory not found: $vcpkgBin"
          }

          $env:PATH = "$(Resolve-Path $vcpkgBin);$env:PATH"
          $env:QT_PLUGIN_PATH = (Resolve-Path $qtPluginRoot).Path
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = (Resolve-Path $qtPlatformRoot).Path

          ctest --test-dir build -C ${{ matrix.config }} --parallel 4 --timeout 30 --output-on-failure

      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plc-hmi-${{ matrix.config }}
          path: |
            build/
            !build/vcpkg_installed/**
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package and deploy-deps check (Release)
    runs-on: windows-2022
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable MSVC 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Capture toolchain cache identity
        id: toolchain
        shell: pwsh
        run: |
          $sdk = "$env:WindowsSDKVersion".TrimEnd('\')
          "id=$env:VCToolsVersion-$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Same user-requested bootstrap-only policy as the build matrix. CMake is
      # the single owner of manifest installation in this job too.
      - name: Setup vcpkg (bootstrap only)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          doNotCache: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}\vcpkg-binary-cache
          key: vcpkg-binary-v1-${{ runner.os }}-x64-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-x64-${{ steps.toolchain.outputs.id }}-
            vcpkg-binary-v1-${{ runner.os }}-x64-

      - name: Ensure vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.workspace }}\vcpkg-binary-cache" | Out-Null

      - name: Configure (HLM_ENABLE_VISION=ON, Release)
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.workspace }}\vcpkg-binary-cache,readwrite'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DHLM_ENABLE_VISION=ON

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package (windeployqt + OpenSSL/OpenCV DLLs + LICENSES)
        run: |
          # CMake manifest mode installs this project's dependencies under the
          # build tree. Prefer that deterministic prefix over any incidental
          # packages which may exist under the bootstrapped vcpkg checkout.
          $vcpkgInstalled = "build/vcpkg_installed/x64-windows"
          if (-not (Test-Path $vcpkgInstalled)) {
            $vcpkgInstalled = "$env:VCPKG_ROOT/installed/x64-windows"
          }
          if (-not (Test-Path $vcpkgInstalled)) {
            throw "vcpkg installed tree not found (tried VCPKG_ROOT and build/vcpkg_installed)"
          }
          pwsh -NoProfile -File scripts/package.ps1 `
            -BuildDir build `
            -OutDir dist `
            -Config Release `
            -VcpkgInstalledDir $vcpkgInstalled `
            -QtBinDir "$vcpkgInstalled/tools/Qt6/bin" `
            -Version 0.1.0

      - name: Check deploy dependencies (positive)
        run: |
          Expand-Archive -Path dist/plc-hmi-0.1.0-win64.zip -DestinationPath dist/check-positive
          pwsh -NoProfile -File scripts/check_deploy_deps.ps1 -PackageDir dist/check-positive

      - name: "Check deploy dependencies (negative: qsqlite.dll removed must fail)"
        run: |
          Expand-Archive -Path dist/plc-hmi-0.1.0-win64.zip -DestinationPath dist/check-negative
          Remove-Item dist/check-negative/sqldrivers/qsqlite.dll
          pwsh -NoProfile -File scripts/check_deploy_deps.ps1 `
            -PackageDir dist/check-negative `
            -ExpectMissing sqldrivers/qsqlite.dll

      - name: Upload release package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plc-hmi-0.1.0-win64
          path: dist/plc-hmi-0.1.0-win64.zip
          if-no-files-found: error
          retention-days: 30
