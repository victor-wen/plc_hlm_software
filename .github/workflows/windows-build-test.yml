# Windows MSVC 2022 x64 Debug/Release build matrix (spec §15.1, §17) plus
# Release packaging, deploy-dependency checks and artifact upload (Task 21).
#
# All third-party actions are pinned to reviewed commit SHAs (not tags or
# branches). Verified 2026-09-02 via the GitHub API:
#   actions/checkout      v7.0.1  -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   ilammy/msvc-dev-cmd   v1.13.0 -> 0b201ec74fa43914dc39ae48a89fd1d8cb592756
#   lukka/run-vcpkg       v11.6   -> b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
#   actions/upload-artifact v7.0.1 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#
# No virtual COM driver is installed in CI (spec §15.5 acceptance runs on a
# local Windows machine with com0com; see docs/testing/rtu-simulator-acceptance.md).
#
# USER-REQUESTED CI OPTIMIZATION (2026-09-04):
# Keep vcpkg caches enabled so repeated agent pushes do not rebuild/download
# Qt, OpenCV, OpenSSL and the rest of the third-party dependency graph from
# scratch on every fresh GitHub-hosted runner. This is intentionally a CI-only
# change requested by the repository owner; it is not an application-code
# change and should be preserved when rebasing/merging agent work.

name: windows-build-test

on:
  push:
    branches: [ main, plc-hmi-implementation ]
  pull_request:

permissions:
  contents: read

# USER-REQUESTED CI OPTIMIZATION: when the remote agent pushes a newer commit,
# the older run for the same branch is obsolete. Cancel it instead of wasting
# runner time finishing vcpkg/build/test for stale source.
concurrency:
  group: windows-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC 2022 x64 ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable MSVC 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # USER-REQUESTED CI OPTIMIZATION: run-vcpkg already enables vcpkg binary
      # caching for built packages on GitHub Actions. doNotCache=false also
      # persists the vcpkg executable/data files. Do not set binaryCachePath
      # explicitly here: run-vcpkg requires a custom path to exist before the
      # action starts, so using its managed default avoids fresh-run failures.
      - name: Setup vcpkg (manifest mode, vcpkg.json)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: true
          doNotCache: false

      - name: Configure (HLM_ENABLE_VISION=ON)
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DHLM_ENABLE_VISION=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      # USER-REQUESTED CI OPTIMIZATION: keep independent test executables
      # parallel for fast feedback. The timeout is also a safety guard: a hung
      # Qt/GUI test (for example an offscreen widget event-loop hang) must fail
      # and let the remaining tests continue instead of occupying a runner
      # indefinitely.
      - name: Test (ctest)
        run: ctest --test-dir build -C ${{ matrix.config }} --parallel 4 --timeout 30 --output-on-failure

      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plc-hmi-${{ matrix.config }}
          path: |
            build/
            !build/vcpkg_installed/**
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package and deploy-deps check (Release)
    runs-on: windows-2022
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable MSVC 2022 x64 developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Same user-requested vcpkg cache policy as the build matrix. Package
      # should restore already-built dependency binaries instead of rebuilding
      # the Qt/OpenCV/OpenSSL graph again after Debug/Release validation.
      - name: Setup vcpkg (manifest mode, vcpkg.json)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: true
          doNotCache: false

      - name: Configure (HLM_ENABLE_VISION=ON, Release)
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DHLM_ENABLE_VISION=ON

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package (windeployqt + OpenSSL/OpenCV DLLs + LICENSES)
        run: |
          $vcpkgInstalled = "$env:VCPKG_ROOT/installed/x64-windows"
          if (-not (Test-Path $vcpkgInstalled)) {
            # run-vcpkg may place the installed tree under the build dir.
            $vcpkgInstalled = "build/vcpkg_installed/x64-windows"
          }
          if (-not (Test-Path $vcpkgInstalled)) {
            throw "vcpkg installed tree not found (tried VCPKG_ROOT and build/vcpkg_installed)"
          }
          pwsh -NoProfile -File scripts/package.ps1 `
            -BuildDir build `
            -OutDir dist `
            -Config Release `
            -VcpkgInstalledDir $vcpkgInstalled `
            -QtBinDir "$vcpkgInstalled/tools/qtbase/bin" `
            -Version 0.1.0

      - name: Check deploy dependencies (positive)
        run: |
          Expand-Archive -Path dist/plc-hmi-0.1.0-win64.zip -DestinationPath dist/check-positive
          pwsh -NoProfile -File scripts/check_deploy_deps.ps1 -PackageDir dist/check-positive

      - name: "Check deploy dependencies (negative: qsqlite.dll removed must fail)"
        run: |
          Expand-Archive -Path dist/plc-hmi-0.1.0-win64.zip -DestinationPath dist/check-negative
          Remove-Item dist/check-negative/sqldrivers/qsqlite.dll
          pwsh -NoProfile -File scripts/check_deploy_deps.ps1 `
            -PackageDir dist/check-negative
          if ($LASTEXITCODE -ne 1) {
            Write-Error "check_deploy_deps did not fail (exit 1) on missing qsqlite.dll"
            exit 1
          }
          Write-Host "Negative test passed: missing qsqlite.dll detected (exit 1)"

      - name: Upload release package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plc-hmi-0.1.0-win64
          path: dist/plc-hmi-0.1.0-win64.zip
          if-no-files-found: error
          retention-days: 30
