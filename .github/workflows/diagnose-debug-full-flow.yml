name: diagnose Debug full-flow artifact

on:
  push:
    branches: [ diagnose-ui-full-flow ]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
          runVcpkgInstall: false
          doNotCache: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}\vcpkg-binary-cache
          key: vcpkg-binary-v1-${{ runner.os }}-x64-
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-x64-

      - name: Restore Qt plugins without compiling the project
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.workspace }}\vcpkg-binary-cache,read'
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.workspace }}\vcpkg-binary-cache" | Out-Null
          cmake -S . -B deps -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DHLM_ENABLE_VISION=ON

      - name: Download compiled Debug artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: "9931025738"
          path: artifact
          github-token: ${{ github.token }}
          repository: victor-wen/plc_hlm_software
          run-id: 33857799040

      - name: Run only Debug full_flow with verbose output
        shell: pwsh
        run: |
          $testDir = (Resolve-Path "artifact/tests/integration").Path
          $prefix = (Resolve-Path "deps/vcpkg_installed/x64-windows/debug").Path
          $pluginRoot = Join-Path $prefix "Qt6/plugins"
          $env:PATH = "$testDir;$(Join-Path $prefix 'bin');$env:PATH"
          $env:QT_PLUGIN_PATH = $pluginRoot
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $pluginRoot "platforms"
          $env:QT_QPA_PLATFORM = "offscreen"
          $output = Join-Path $env:RUNNER_TEMP "full-flow-output.txt"
          & (Join-Path $testDir "test_full_flow.exe") -v2 -o "$output,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $output) {
            Get-Content $output
          }
          "test_full_flow exit code: $exitCode"
          exit $exitCode
