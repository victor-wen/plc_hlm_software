name: publish UI v0.1.1 without rebuilding

on:
  push:
    branches: [ release/ui-v0.1.1 ]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plc-hmi-Release
          path: release-build
          github-token: ${{ github.token }}
          repository: victor-wen/plc_hlm_software
          run-id: 33857799040

      - name: Reuse verified Windows runtime bundle
        run: |
          curl -L --fail --silent --show-error "https://github.com/victor-wen/plc_hlm_software/releases/download/v0.1.0/plc-hmi-0.1.0-win64.zip" -o runtime.zip
          unzip -q runtime.zip -d package
          test -f release-build/hlm_app.exe
          test -f release-build/plc_simulator.exe
          cp release-build/hlm_app.exe package/hlm_app.exe
          cp release-build/plc_simulator.exe package/plc_simulator.exe

      - name: Verify required runtime files
        run: |
          test -f package/freetype.dll
          test -f package/platforms/qwindows.dll
          test -f package/sqldrivers/qsqlite.dll
          test -f package/libcrypto-3-x64.dll
          test -f package/libssl-3-x64.dll
          test -f package/vcruntime140.dll
          test -f package/msvcp140.dll
          test -n "$(find package -maxdepth 1 -iname 'opencv_core*.dll' -print -quit)"

      - name: Create archive and checksum
        run: |
          cd package
          zip -9 -r ../plc-hmi-0.1.1-win64.zip .
          cd ..
          sha256sum plc-hmi-0.1.1-win64.zip > plc-hmi-0.1.1-win64.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 plc-hmi-0.1.1-win64.zip plc-hmi-0.1.1-win64.zip.sha256 --repo "${{ github.repository }}" --target "22289dfb0d94694c3c364b123ff2ebb6f0c2d639" --title "PLC HMI v0.1.1" --notes "Industrial PLC interface refresh. Release build passed all 32 tests. Package reuses the previously verified Qt/OpenCV/OpenSSL/MSVC runtime bundle and includes freetype.dll. Source commit: 22289dfb0d94694c3c364b123ff2ebb6f0c2d639"
